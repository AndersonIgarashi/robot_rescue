<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5a5cff" />
    <meta name="description" content="Build Your AI — a mobile-first HTML5 playable ad built with TypeScript, Three.js and WebGL." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Build Your AI</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='14' width='48' height='40' rx='14' fill='%235a5cff'/%3E%3Crect x='15' y='22' width='34' height='22' rx='8' fill='%231b1f3b'/%3E%3Ccircle cx='25' cy='33' r='5' fill='%2345f0df'/%3E%3Ccircle cx='39' cy='33' r='5' fill='%2345f0df'/%3E%3Crect x='30' y='4' width='4' height='10' fill='%235a5cff'/%3E%3Ccircle cx='32' cy='5' r='4' fill='%2345f0df'/%3E%3C/svg%3E"
    />
    <style>
      /* Critical boot styles: painted before any JS runs, so there is never a blank screen. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #4b5cff;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(120% 75% at 50% 42%, #7fd8ff 0%, #5a6bff 55%, #4a3fd8 100%);
        color: #fff;
        font: 900 18px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.12em;
        text-shadow: 0 2px 0 rgba(29, 22, 70, 0.45);
        transition: opacity 0.35s ease, visibility 0.35s;
      }
      #boot.is-done {
        opacity: 0;
        visibility: hidden;
      }
      .boot__ring {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 6px solid rgba(255, 255, 255, 0.28);
        border-top-color: #fff;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot__ring"></div>
      <div>BUILDING...</div>
    </div>
    <noscript>
      <p style="position: fixed; inset: auto 0 40px; text-align: center; color: #fff; font: 700 16px system-ui">
        Enable JavaScript to build your AI.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
